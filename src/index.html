<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MdView</title>
  <link rel="stylesheet" href="style.css">
  <script src="generated/rich-editor.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img class="brand-icon" src="assets/mdview.svg" alt="MdView 书页标志"><strong>Md<span>View</span></strong><span class="brand-label">阅读，让思路清晰</span></div>
    <div class="tools">
      <button id="new" title="新建空白文档（Ctrl+N）">新建</button>
      <button id="open" class="primary" title="打开 Markdown（Ctrl+O）">＋ 打开文件</button>
      <button id="reload" title="重新读取文件（Ctrl+R）">刷新</button>
      <button id="settings" title="设置默认保存位置">设置</button>
      <button id="edit" title="直接编辑（Ctrl+E）">编辑</button><button id="save" title="保存（Ctrl+S）">保存</button><button id="save-as">另存为</button><span id="edit-status" role="status"></span>
      <span class="divider"></span>
      <label class="sr-only" for="theme">阅读主题</label>
      <select id="theme" title="阅读主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option><option value="warm">暖纸</option></select>
      <button id="font-down" aria-label="减小字号" title="减小阅读字号（Ctrl＋滚轮向下）">A−</button><span id="font-size" aria-live="polite">16</span><button id="font-up" aria-label="增大字号" title="增大阅读字号（Ctrl＋滚轮向上）">A＋</button>
    </div>
  </header>
  <div class="workspace">
    <aside id="sidebar">
      <div class="sidebar-heading"><span>文档目录</span><span id="heading-count">0</span></div>
      <nav id="outline" aria-label="文档目录"></nav>
      <div class="sidebar-note"><span class="status-dot"></span>本地阅读 · 文件不上传<br><span>拖入 Markdown 即可打开</span></div>
    </aside>
    <main id="reader">
      <div class="document-header"><div><div class="eyebrow">MARKDOWN READER</div><h1 id="file-name">准备阅读</h1><p id="file-path">打开一份文档，开始专注阅读。</p></div><button id="toggle-outline" aria-label="切换目录" aria-expanded="true" title="切换目录（Ctrl+Shift+B）">☰</button></div>
      <div id="notice" role="status" hidden></div>
      <div id="editor-tools" hidden>
        <div class="editor-actions"><select id="block-type" aria-label="段落样式"><option value="0">正文</option><option value="1">标题 1</option><option value="2">标题 2</option><option value="3">标题 3</option></select><button data-edit="toggleBold">加粗</button><button data-edit="toggleItalic">斜体</button><button data-edit="toggleBulletList">列表</button><button data-edit="toggleOrderedList">编号</button><button data-edit="toggleBlockquote">引用</button><button data-edit="toggleCodeBlock">代码块</button><button data-edit="table">表格</button><button data-edit="addRowAfter">加行</button><button data-edit="deleteTable">删表</button><button data-edit="undo">撤销</button><button data-edit="redo">重做</button></div>
        <p class="editor-note">直接点击正文输入 · Ctrl+B 加粗 · Ctrl+S 保存 · 保存编辑后会规范化 Markdown 排版</p>
      </div>
      <article id="editor-content" class="markdown" hidden></article>
      <article id="content" class="markdown" aria-label="Markdown 内容"></article>
      <div class="end-mark">— 阅读到这里 —</div>
    </main>
  </div>
  <footer><span id="document-status">就绪</span><span>UTF-8<span class="footer-separator">·</span>Markdown<span class="footer-separator">·</span><span id="theme-status">浅色</span></span></footer>
  <dialog id="code-dialog" aria-labelledby="code-dialog-title">
    <header class="code-dialog-heading"><div><strong id="code-dialog-title">单独查看代码</strong><span>Ctrl＋滚轮缩放 · 点击百分比恢复默认</span></div><button id="close-code-dialog" type="button" autofocus>关闭 Esc</button></header>
    <div id="code-dialog-content" class="markdown"></div>
    <div id="code-dialog-status" class="sr-only" role="status"></div>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <header class="code-dialog-heading"><strong id="settings-title">设置</strong><button id="close-settings" autofocus>关闭 Esc</button></header>
    <h3>默认保存文件夹</h3>
    <p id="save-directory" role="status"></p>
    <p class="settings-note">新建文档和另存为时默认使用此位置，仍可在保存窗口中修改。已有文件直接保存到原位置。</p>
    <div class="editor-actions"><button id="choose-save-directory">选择文件夹…</button><button id="reset-save-directory">恢复系统文档目录</button></div>
    <p id="settings-error" role="alert" hidden></p>
  </dialog>
  <div id="drop-overlay" hidden><div><strong>松开，开始阅读</strong><span>支持 .md / .markdown</span></div></div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
